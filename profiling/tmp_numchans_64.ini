; 64채널 실험용 시스템 설정 파일이다.
; 이 파일은 이론적으로 매우 높은 채널 병렬성을 주었을 때의 동작을 보기 위한 비교 기준이다.
; 1채널 파일과 대비해서 병렬성이 성능에 얼마나 영향을 주는지 확인할 때 사용한다.

NUM_CHANS=64
; 논리 채널 수를 64개로 늘린다.
; 채널별 memory controller가 많아져 병렬성이 크게 증가하지만, 그만큼 주소 분산과 스케줄링 영향도 커진다.

JEDEC_DATA_BUS_BITS=64
; 데이터 버스 폭이다.
; 채널 수만 키우고 버스 폭은 유지해서, 채널 수 증가 효과를 분리해서 보기 좋다.

TRANS_QUEUE_DEPTH=64
; host 트랜잭션 큐 깊이이다.
; 다채널 환경에서도 요청을 충분히 쌓아둘 수 있게 기본값을 유지한다.

CMD_QUEUE_DEPTH=64
; DRAM 명령 큐 깊이이다.
; 많은 채널에서 동시에 명령이 몰릴 수 있으므로, 큐가 너무 얕지 않게 둔다.

EPOCH_LENGTH=1000000
; 통계 집계 구간 길이다.
; 16채널 파일과 같은 값을 유지해 결과 비교가 쉽다.

ROW_BUFFER_POLICY=open_page
; 열린 row를 유지하는 정책이다.
; 높은 채널 수 환경에서도 row hit를 최대한 활용하기 위해 기본적으로 이 값을 쓴다.

ADDRESS_MAPPING_SCHEME=Scheme8
; 주소 매핑 방식이다.
; PIM과 일반 메모리 접근을 일관되게 다루기 위해 기본 실험과 같은 주소 스킴을 유지한다.

SCHEDULING_POLICY=rank_then_bank_round_robin
; 명령 발행 순서 정책이다.
; 많은 채널에서 공정성과 성능을 어떻게 나눌지 보기 위한 기본 정책이다.

QUEUING_STRUCTURE=per_rank
; 큐 구조를 rank 단위로 둔다.
; 채널이 많아도 구조를 기본과 같게 두어 비교가 쉬워진다.

PIM_PRECISION=FP16
; PIM 연산 정밀도다.
; 기본 파일과 같은 정밀도를 유지해 채널 수 영향만 확인한다.

; true/false 옵션은 모두 소문자로 적는다.

DEBUG_TRANS_Q=false
; 트랜잭션 큐 출력 여부다.

DEBUG_CMD_Q=false
; 명령 큐 출력 여부다.

DEBUG_ADDR_MAP=false
; 주소 매핑 출력 여부다.

DEBUG_BUS=false
; 버스 상태 출력 여부다.

DEBUG_BANKSTATE=false
; bank state 출력 여부다.

DEBUG_BANKS=false
; bank 내부 상태 출력 여부다.

DEBUG_POWER=false
; 전력 출력 여부다.

DEBUG_TRANS_TRACE=false
; 트랜잭션 trace 출력 여부다.

; PIM 디버그 옵션
DEBUG_PIM_TIME=false
; PIM 시간 trace 출력 여부다.

DEBUG_CMD_TRACE=true
; PIM 명령 trace 출력 여부다.
; 다채널 실험에서도 PIM 명령 흐름을 보기 위해 기본적으로 true로 둔다.

DEBUG_PIM_BLOCK=false
; PIM block 내부 출력 여부다.

; 출력 옵션
SHOW_SIM_OUTPUT=false
; 일반 시뮬레이터 출력을 화면에 표시할지 정한다.

LOG_OUTPUT=false
; 로그 파일 저장 여부다.

SIM_TRACE_FILE=pim_trace.out
; trace 파일 이름이다.

VIS_FILE_OUTPUT=false
; 시각화 파일 생성 여부다.

USE_LOW_POWER=false
; 유휴 시 저전력 모드 진입 여부다.
; 64채널 비교 실험에서는 성능을 더 직접적으로 보려는 목적에서 false로 두는 경우가 많다.

VERIFICATION_OUTPUT=false
; 외부 검증용 출력 여부다.

TOTAL_ROW_ACCESSES=65535
; 한 row를 오래 유지할 때의 제한값이다.

PRINT_CHAN_STAT=true
; 채널 통계를 출력할지 정한다.
; 64채널 실험에서는 채널별 분산과 병렬성이 중요한 관찰 대상이므로 true로 둔다.

PRINT_MEM_TRACE=true
; 메모리 trace를 출력할지 정한다.
; 다채널에서 요청이 어떻게 분산되는지 자세히 보고 싶을 때 켠다.



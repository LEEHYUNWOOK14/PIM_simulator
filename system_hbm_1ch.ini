; 단일 채널(1ch) 실험용 시스템 설정 파일이다.
; 이 파일은 병렬성을 거의 쓰지 않는 조건에서, 한 채널이 얼마나 버티는지 또는 병목이 어디서 생기는지를 보기 위한 기준이다.
; 다채널 구조와 비교하면 채널 병렬성의 효과를 가장 직관적으로 확인할 수 있다.

NUM_CHANS=1
; 논리 채널 수를 1개로 제한한다.
; 하나의 memory controller만 사용하므로 병렬성이 가장 낮고, 단일 채널 기준의 성능을 보기 좋다.

JEDEC_DATA_BUS_BITS=64
; 데이터 버스 폭이다.
; 채널 수는 1이지만 버스 폭은 그대로 두어, 채널 수 변화의 영향만 분리해서 보기 좋다.

TRANS_QUEUE_DEPTH=64
; host 트랜잭션 큐 깊이이다.
; 요청을 얼마나 쌓아둘 수 있는지 나타내며, 단일 채널에서도 큐 병목이 생길 수 있는지를 본다.

CMD_QUEUE_DEPTH=64
; DRAM 명령 큐 깊이이다.
; 명령이 얼마나 많이 대기할 수 있는지 나타내고, 큐가 작은 경우 병목이 생길 수 있다.

EPOCH_LENGTH=1000000
; 통계 집계 구간 길이다.
; 기본 파일과 동일하게 두어 비교 실험이 쉽도록 한다.

ROW_BUFFER_POLICY=open_page
; row buffer를 열린 상태로 유지하는 정책이다.
; row hit를 최대한 활용하는 조건으로 실험하기 좋다.

ADDRESS_MAPPING_SCHEME=Scheme8
; 주소 매핑 방식이다.
; 1채널이어도 PIM 경로와 주소 분해가 일관되게 동작하는지 확인하기 위해 같은 스킴을 유지한다.

SCHEDULING_POLICY=rank_then_bank_round_robin
; 명령 발행 순서 정책이다.
; 단일 채널에서는 정책 변화 효과가 작을 수 있지만, 기본 정책을 고정해 비교 기준을 유지한다.

QUEUING_STRUCTURE=per_rank
; 큐 구조를 rank 단위로 둔다.
; 단일 채널 실험에서도 구조를 기본값으로 유지해 다른 설정과 비교하기 쉽다.

PIM_PRECISION=FP16
; PIM 연산 정밀도다.
; 기본 실험과 동일한 정밀도를 사용해서 채널 수 효과만 분리해서 보게 한다.

; true/false는 모두 소문자만 사용한다.

DEBUG_TRANS_Q=false
; 트랜잭션 큐 출력 여부다.

DEBUG_CMD_Q=false
; 명령 큐 출력 여부다.

DEBUG_ADDR_MAP=false
; 주소 매핑 출력 여부다.

DEBUG_BUS=false
; 버스 상태 출력 여부다.

DEBUG_BANKSTATE=false
; bank state 출력 여부다.

DEBUG_BANKS=false
; bank 내부 상태 출력 여부다.

DEBUG_POWER=false
; 전력 출력 여부다.

DEBUG_TRANS_TRACE=false
; 트랜잭션 trace 출력 여부다.

; PIM 디버그 옵션
DEBUG_PIM_TIME=false
; PIM 시간 trace 출력 여부다.

DEBUG_CMD_TRACE=true
; PIM 명령 trace 출력 여부다.
; 단일 채널에서도 PIM 명령이 어떻게 흐르는지 보기 위해 true로 둔다.

DEBUG_PIM_BLOCK=false
; PIM block 내부 출력 여부다.

; 출력 옵션
SHOW_SIM_OUTPUT=false
; 일반 시뮬레이터 출력을 화면에 표시할지 정한다.

LOG_OUTPUT=false
; 로그 파일 저장 여부다.

SIM_TRACE_FILE=pim_trace.out
; trace 파일 이름이다.

VIS_FILE_OUTPUT=false
; 시각화 파일 생성 여부다.

USE_LOW_POWER=true
; 유휴 시 저전력 모드 진입 여부다.

VERIFICATION_OUTPUT=false
; 외부 검증용 출력 여부다.

TOTAL_ROW_ACCESSES=65535
; 한 row를 오래 유지할 때의 제한값이다.

PRINT_CHAN_STAT=false
; 채널 통계 출력 여부다.

PRINT_MEM_TRACE=false

; 1채널 기준 설정에서는 기본적으로 로직 다이 출력 모델을 끈다.
; true이면 logic-die weight staging command가 일반 DRAM row 상태를 우회한다.
LOGIC_DIRECT_STAGING_COMMAND_PATH=false
HIERARCHY_SOURCE_QUEUES=false
LOGIC_DEPTHWISE_ACCUMULATION=false
; 아직 실행을 시작하지 못한 logic-PCU reservation의 최대 수다. 0은 기존 무제한 모델이다.
LOGIC_PCU_QUEUE_DEPTH=0
LOGIC_ACCUMULATOR_ENTRIES=0
LOGIC_ACCUMULATOR_LATENCY=1
LOGIC_ACCUMULATOR_PIPELINES=0 ; 0: legacy model, 1+: shared 32 B FP16 burst pipelines
LOGIC_ACCUMULATOR_BW=64
LOGIC_ACCUMULATOR_OVERLAP=false
BANK_LOCAL_AGGREGATION_TAPS=1
BANK_LOCAL_ACCUMULATOR_ENTRIES=0
BANK_LOCAL_ACCUMULATOR_PORTS=0
BANK_LOCAL_ACCUMULATOR_LATENCY=1
BANK_LOCAL_ACCUMULATOR_BANKS=1
BANK_LOCAL_ACCUMULATOR_TILE_BATCH=0
LOGIC_ACCUMULATOR_TRACE_FILE=none
; ActualShapeUibRunsEndToEnd의 단계별 cycle과 FP16 데이터 해시를 저장할 CSV 경로다. none이면 기록하지 않는다.
LOGIC_UIB_TRACE_FILE=none
LOGIC_OUTPUT_BUFFER_ENABLE=false
LOGIC_OUTPUT_BUFFER_ENTRIES=2
LOGIC_OUTPUT_DRAIN_LATENCY=0
LOGIC_OUTPUT_DRAIN_BW=0
; true이면 같은 spatial group의 연속 GEMV 사이에서 HAB 상태를 유지한다.
; LOGIC_OUTPUT_BUFFER_ENABLE=true일 때만 적용되며 group의 마지막 위치에서는 SB로 복귀한다.
LOGIC_HAB_RESIDENCY=false
; Logic PIM mode가 실제로 바뀐 뒤 후속 명령을 받을 수 있을 때까지의 state-machine cycle이다.
; RTL 측정값이 없을 때 기본값 0을 사용하고, 구조 비교 실험에서는 동일한 값을 적용한다.
LOGIC_MODE_TRANSITION_LATENCY=0
; 0은 watchdog 비활성화다. 진단 시 지정 cycle 뒤 pending queue 상태를 출력하고 테스트를 중단한다.
PIM_RUN_WATCHDOG_CYCLES=0
; 메모리 trace 출력 여부다.

NUM_BANK_GROUPS=4   ; 한 rank 안에서 bank를 몇 개의 bank group으로 묶을지 정한다. bank group이 나뉘면 같은 그룹 내부 접근과 다른 그룹 접근의 타이밍 제약이 달라져서, 스케줄링과 대역폭 특성에 영향을 준다.
NUM_BANKS=16        ; 한 rank 안의 총 bank 수다. bank는 DRAM에서 병렬성을 만드는 기본 단위이므로, 이 값이 클수록 동시에 처리할 수 있는 작업이 많아진다.
NUM_COLS=128        ; 한 row 안에 몇 개의 column이 있는지 나타낸다. 주소를 열 방향으로 어떻게 펼칠지, 그리고 한 번의 burst에서 어느 정도 범위를 다룰지에 영향을 준다.
NUM_ROWS=16384      ; 한 bank 안의 row 수다. row가 많을수록 저장 가능한 공간이 넓어지고, row 단위 접근 범위도 커진다.
NUM_PIM_BLOCKS=8    ; bank-side PIM 블록 수다. 현재 시뮬레이터에서 bank 옆에 붙은 로컬 PIM 연산 유닛이 몇 개 있는지를 정한다.
DEVICE_WIDTH=64     ; 메모리 디바이스의 데이터 폭이다. 한 번에 몇 비트가 오가는지를 나타내며, 내부 전송량과 버스 폭을 이해하는 데 중요하다.
BL=4                ; burst length다. 한 번의 메모리 접근에서 몇 개의 burst를 주고받는지 정한다. 값이 커지면 한 번에 더 많은 데이터를 전송하지만 접근 단위도 커진다.
RL=20               ; read latency다. read 명령을 보낸 뒤 실제 데이터가 나오기까지의 지연 시간이다.
WL=8                ; write latency다. write 명령을 보낸 뒤 실제 쓰기 반영이 되기까지의 지연 시간이다.
tCCDS=2             ; 같은 bank group 안에서 연속 column 접근을 할 때 필요한 짧은 지연이다. 연속 read/write 사이의 최소 간격처럼 보면 된다.
tCCDL=4             ; 같은 bank group 안에서 연속 column 접근을 할 때 필요한 긴 지연이다. short보다 보수적으로 잡는 경우의 간격이다.
tCCDR=3             ; read 관련 column 전환 지연이다. read 버스트를 연속으로 다룰 때 필요한 시간 차이로 이해하면 된다.
tRCDRD=14           ; row를 activate한 뒤 read를 시작할 수 있을 때까지의 지연이다. row를 열자마자 바로 읽을 수 없고 잠깐 기다려야 한다.
tRCDWR=10           ; row를 activate한 뒤 write를 시작할 수 있을 때까지의 지연이다. read와 마찬가지로 쓰기 전에 준비 시간이 필요하다.
tRAS=33             ; row active time이다. 열린 row를 최소 얼마 동안 유지해야 하는지를 정한다.
tRRDS=4             ; activate-to-activate short delay다. 서로 다른 bank를 빠르게 활성화할 때 필요한 짧은 간격이다.
tRRDL=6             ; activate-to-activate long delay다. 더 보수적으로 적용되는 활성화 간 간격이다.
tRC=47              ; row cycle time이다. row를 열고 다시 닫기까지의 전체 주기라서, row 전환 비용을 볼 때 중요하다.
tRP=14              ; precharge time이다. 열린 row를 닫고 다음 row를 준비할 때 필요한 시간이다.
tRTPS=4             ; read 후 precharge를 하기까지의 짧은 지연이다. 읽은 직후 row를 닫기 전까지 필요한 최소 간격으로 보면 된다.
tRTPL=5             ; read 후 precharge를 하기까지의 긴 지연이다. 더 느긋한 전환 규칙이라고 생각하면 된다.
tWR=16              ; write recovery time이다. write 후에 안전하게 row를 닫을 수 있을 때까지 기다려야 하는 시간이다.
tWTRS=4             ; write-to-read short delay다. write를 한 뒤 read로 바꾸기 전에 필요한 짧은 간격이다.
tWTRL=9             ; write-to-read long delay다. write와 read 사이의 더 긴 전환 간격이다.
XAW=4               ; activate window에서 허용되는 activate 횟수 제한이다. 너무 많은 activate가 짧은 시간에 몰리지 않도록 제어한다.
tXAW=16             ; activate window의 길이다. XAW 제한이 적용되는 시간 구간이라고 보면 된다.
tRTRS=1             ; read-to-read 또는 transfer 계열에서 필요한 짧은 간격이다. 연속 read나 관련 전송을 붙여서 수행할 때의 최소 시간이다.
tREFI=3900          ; 일반 refresh interval이다. DRAM이 몇 사이클마다 refresh를 해야 하는지 나타내는 주기다.
tREFISB=121         ; SB 모드에서의 refresh interval이다. PIM이나 저전력 모드에서는 이 값을 따로 써서 refresh 빈도를 다르게 다룰 수 있다.
tRFC=350            ; 일반 refresh cycle time이다. refresh 하나를 수행하는 데 걸리는 시간이다.
tRFCSB=160          ; SB 모드 refresh cycle time이다. 일반 refresh와 별도로 PIM/특수 모드에서의 refresh 시간을 나타낸다.
tXP=8               ; power-down 상태에서 빠져나올 때 필요한 지연이다. 다시 동작 상태로 돌아오기 전에 기다리는 시간이다.
tCKE=8              ; clock enable 전환 지연이다. 클럭 enable 상태를 바꾸는 데 필요한 시간이다.
tCMD=1              ; 명령 발행의 기본 단위 지연이다. 명령을 어떤 템포로 흘릴지 정하는 보조 값으로 이해하면 된다.
AL=0                ; additive latency다. 명령 지연을 보정하기 위한 추가 레이턴시 항목이다.
tCK=1               ; 클럭 주기다. 모든 타이밍 파라미터를 사이클 기준으로 환산할 때 기준이 되는 값이다.
IDD0=0              ; 활성 상태에서의 기본 전류 모델이다. 전력 계산에서 쓰는 DRAM 전류 항목 중 하나다.
IDD0C=0             ; IDD0의 column 관련 세부 전류 항목이다. column 동작이 반영된 좀 더 세밀한 전류 값이다.
IDD0Q=0             ; IDD0의 queue 관련 세부 전류 항목이다. 큐 동작을 분리해서 보고 싶을 때 쓰는 값이다.
IDD1=0              ; active standby 전류다. 활성 상태를 유지하면서 쉬고 있을 때의 전류 모델이다.
IDD2P=0             ; precharge power-down 전류다. precharge 상태에서 저전력 대기할 때의 전류다.
IDD2Q=0             ; precharge power-down의 세부 전류 항목이다.
IDD2N=0             ; normal standby 전류다. 일반적인 대기 상태에서의 전류 모델이다.
IDD3Pf=0            ; active power-down fast current다. active power-down에서 fast 경로를 나타내는 전류다.
IDD3Ps=0            ; active power-down slow current다. active power-down에서 slow 경로를 나타내는 전류다.
IDD3N=0             ; active standby current다. 활성 상태 대기 전류다.
IDD3NC=0            ; active standby에서 column 관련 전류 항목이다.
IDD3NQ=0            ; active standby에서 queue 관련 전류 항목이다.
IDD4W=0             ; write operation current다. write가 동작할 때 소모되는 전류다.
IDD4WC=0            ; write current의 column 성분이다.
IDD4WQ=0            ; write current의 queue 성분이다.
IDD4R=0             ; read operation current다. read가 동작할 때 소모되는 전류다.
IDD4RC=0            ; read current의 column 성분이다.
IDD4RQ=0            ; read current의 queue 성분이다.
IDD5=0              ; refresh current다. refresh 동작 중의 전류다.
IDD6=0              ; self-refresh current다. 자기 새로고침 상태에서의 전류다.
IDD6L=0             ; self-refresh low-power current다. 더 낮은 전력의 self-refresh 상태를 나타낸다.
IDD7=0              ; 다른 power state에서의 동작 전류 항목이다.
Vdd=1               ; DRAM core supply voltage다. 코어가 동작하는 기준 전압이다.
Vddc=1              ; core/array supply voltage 변형 값이다. 배열이나 코어 전압 모델에 쓰인다.
Vddq=1              ; I/O supply voltage다. 외부 입출력 신호가 사용하는 전압이다.
Vpp=1               ; wordline boost voltage다. wordline을 충분히 올리기 위한 승압 전압이다.
Ealu=0              ; PIM ALU 에너지 모델 값이다. PIM 연산기 산술 동작의 에너지 계산에 쓰인다.
Ereg=0              ; PIM register 에너지 모델 값이다. PIM 내부 레지스터 접근 에너지 계산에 쓰인다.
ENABLE_BANK_SIDE_PIM=true
ENABLE_LOGIC_DIE_PIM=true
NUM_LOGIC_PIM_UNITS=16
LOGIC_PIM_LATENCY=2
LOGIC_PIM_BW=64
HIERARCHY_PIM_BW=64
LOGIC_COMPACT_OUTPUT=true
LOGIC_SPATIAL_GROUPING=true
LOGIC_GLOBAL_SCHEDULER=true
LOGIC_CMD_OVERHEAD=4
LOGIC_CMD_COALESCING=true
LOGIC_SHARED_WEIGHT_BUFFER=true
LOGIC_WEIGHT_BUFFER_BYTES=65536
LOGIC_WEIGHT_FILL_CHANNELS=32
LOGIC_WEIGHT_FILL_POLICY=row_interleaved
LOGIC_WEIGHT_STAGING_ROW=2048
LOGIC_WEIGHT_BUFFER_WRITE_PORTS=0
LOGIC_WEIGHT_BUFFER_WRITE_LATENCY=1
PIM_TARGET=hybrid

ENABLE_BANK_SIDE_PIM=true
; bank-side PIM을 사용할지 정하는 값이다.
; 64채널 기준 실험에서도 bank-side PIM이 기본이므로 true로 둔다.

ENABLE_LOGIC_DIE_PIM=true
; logic-die PIM을 사용할지 정하는 값이다.
; 아직 logic-die 본체는 연결 전이므로 false로 둔다.

NUM_LOGIC_PIM_UNITS=16
; logic-die에 둘 PIM 유닛 수다.
; 기능 검증 기본값은 기존 PIM block 수와 같은 8이며, logic-die를 켤 때 1 이상이어야 한다.

LOGIC_PIM_LATENCY=2
; logic-die PIM의 지연시간 기본값이다.
; 연산 wave당 cycle이며 0은 추가 compute 지연을 적용하지 않는 호환 모드다.

LOGIC_PIM_BW=64
; logic-die PIM의 내부 처리 대역폭 기본값이다.
; 단위는 byte/cycle이며 0은 대역폭 제한을 적용하지 않는 호환 모드다.

HIERARCHY_PIM_BW=64
; bank-side PCU와 logic-die PCU 사이의 중간 tensor 전송 대역폭(byte/cycle)이다.
; 0이면 전송 byte는 계측하지만 추가 transfer cycle은 적용하지 않는다.

LOGIC_COMPACT_OUTPUT=true
LOGIC_SPATIAL_GROUPING=true
LOGIC_GLOBAL_SCHEDULER=true
LOGIC_CMD_OVERHEAD=4
LOGIC_CMD_COALESCING=true
LOGIC_SHARED_WEIGHT_BUFFER=true
LOGIC_WEIGHT_BUFFER_BYTES=65536
; 공유 가중치 버퍼를 채울 때 source write를 몇 HBM channel에 분산할지 정한다.
; 0은 기존 compact group channel만 사용하고, 1~64는 지정한 수만큼 round-robin한다.
LOGIC_WEIGHT_FILL_CHANNELS=32
; row_interleaved는 전용 row 안에서 bank를 교차 사용해 row locality와 bank 병렬성을 함께 사용한다.
LOGIC_WEIGHT_FILL_POLICY=row_interleaved
; row_local 정책이 source weight를 연속 배치할 전용 시작 row다.
LOGIC_WEIGHT_STAGING_ROW=2048
; 0은 write port 병목을 무시한다. 1 이상이면 중앙 버퍼 동시 write lane 수다.
LOGIC_WEIGHT_BUFFER_WRITE_PORTS=0
LOGIC_WEIGHT_BUFFER_WRITE_LATENCY=1
; 공유 weight fill 완료 후 logic PCU 명령을 내보내기 전에 기다릴 추가 동기화 cycle이다.
; 0은 추가 대기 없음이며, fill/compute 경계의 명시적 release 비용을 실험할 때만 늘린다.
LOGIC_POST_FILL_GUARD_CYCLES=64
; true이면 logic-die pointwise의 물리 output tile을 64-output/channel 단위로 축소한다.
; false이면 기존 4096-output 고정 mapping을 사용한다.

PIM_TARGET=hybrid
; 어느 계층 PIM을 우선 볼지 정하는 값이다.
